<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5949"/>
      <stop offset="100%" stop-color="#253B30"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E08E6C"/>
      <stop offset="100%" stop-color="#C67856"/>
    </linearGradient>
  </defs>
  <!-- Background circle with warm cream tone -->
  <rect width="64" height="64" rx="16" fill="#FAF7F2"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#E6DFD5" stroke-width="1"/>
  
  <!-- Stylized Lotus / Psi symbol for Psychology & Mental Health -->
  <g transform="translate(32, 33)">
    <!-- Central stem -->
    <path d="M 0,-16 L 0,14" stroke="url(#sageGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left petal / arc -->
    <path d="M 0,6 C -12,6 -16,-4 -16,-10 C -16,-15 -11,-16 -8,-12 C -6,-9 -3,1 0,6 Z" fill="url(#sageGrad)" opacity="0.9"/>
    <!-- Right petal / arc -->
    <path d="M 0,6 C 12,6 16,-4 16,-10 C 16,-15 11,-16 8,-12 C 6,-9 3,1 0,6 Z" fill="url(#sageGrad)" opacity="0.9"/>
    <!-- Central droplet / spark -->
    <circle cx="0" cy="-18" r="2.2" fill="url(#terracottaGrad)"/>
    <!-- Base grounding bar -->
    <path d="M -7,14 L 7,14" stroke="url(#sageGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
